<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Modern Gradient App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div>
          <h1 class="app-title">My Gradient App</h1>
          <p class="app-subtitle">A clean, modern starter layout</p>
        </div>
        <button class="button" id="primary-action">Get Started</button>
      </header>

      <section class="card">
        <span class="badge">Welcome</span>
        <h2 style="margin-top: 10px; font-size: 1rem;">Hello there 👋</h2>
        <p style="margin-top: 6px; font-size: 0.9rem; color: #d1d5db;">
          This is a minimal modern UI template using a blue–purple gradient background.
          You can customize this content to match your app.
        </p>
      </section>

      <section style="margin-top: 18px;">
        <div class="field">
          <label class="field-label" for="name-input">Your name</label>
          <input
            id="name-input"
            type="text"
            class="input"
            placeholder="Type your name..."
          />
        </div>
        <button class="button" id="save-name">Save</button>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
